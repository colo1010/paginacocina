<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Burger Kitchen | Pantalla de Cocina (KDS)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SDKs de Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4 sm:p-6">

  <!-- ENCABEZADO DE COCINA -->
  <header class="flex flex-col sm:flex-row justify-between items-center pb-6 border-b border-gray-800 gap-4">
    <div>
      <h1 class="text-2xl sm:text-3xl font-black text-emerald-400 flex items-center gap-2">
        <span>👨‍🍳</span> BURGER KITCHEN — COCINA
      </h1>
      <p class="text-gray-400 text-xs sm:text-sm mt-1">
        Gestión de comandas en tiempo real vía Firebase.
      </p>
    </div>

    <!-- Filtros de Estado -->
    <div class="flex items-center gap-2 bg-gray-800 p-1.5 rounded-xl border border-gray-700 text-xs sm:text-sm">
      <button onclick="filtrarPedidos('todos')" id="btn-filtro-todos" class="px-3 py-1.5 rounded-lg font-bold bg-emerald-600 text-white">
        Todos (<span id="cant-todos">0</span>)
      </button>
      <button onclick="filtrarPedidos('pendiente')" id="btn-filtro-pendiente" class="px-3 py-1.5 rounded-lg font-bold text-gray-300 hover:bg-gray-700">
        Pendientes (<span id="cant-pendiente">0</span>)
      </button>
      <button onclick="filtrarPedidos('preparacion')" id="btn-filtro-preparacion" class="px-3 py-1.5 rounded-lg font-bold text-gray-300 hover:bg-gray-700">
        En Cocina (<span id="cant-preparacion">0</span>)
      </button>
    </div>
  </header>

  <main class="mt-6">
    <div id="sin-pedidos" class="text-center py-20 hidden">
      <div class="text-6xl mb-4">🍔</div>
      <h2 class="text-xl font-bold text-gray-400">No hay comandas activas en este momento</h2>
      <p class="text-gray-600 text-sm mt-1">Los nuevos pedidos realizados aparecerán aquí automáticamente.</p>
    </div>

    <div id="grid-comandas" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>

  <script>
   
    // Configuración de Firebase (debe ser la misma que en la tienda)
    const firebaseConfig = {
  apiKey: "AIzaSyCI3CWPBGqBsq30CC3AouVu3p4uhkNOkrw",
  authDomain: "comandas-114cc.firebaseapp.com",
  databaseURL: "https://comandas-114cc-default-rtdb.firebaseio.com",
  projectId: "comandas-114cc",
  storageBucket: "comandas-114cc.firebasestorage.app",
  messagingSenderId: "852269899168",
  appId: "1:852269899168:web:e05fef229b9a8db29158c5",
  measurementId: "G-JGJWWQLVZ1"
};

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let pedidos = [];
    let filtroActual = 'todos';

    // ESCUCHAR CAMBIOS EN TIEMPO REAL DESDE FIREBASE
    db.ref('pedidos').on('value', (snapshot) => {
      const data = snapshot.val();
      pedidos = [];
      if (data) {
        Object.keys(data).forEach(key => {
          pedidos.push(data[key]);
        });
        // Ordenar del más reciente al más antiguo
        pedidos.sort((a, b) => b.timestamp - a.timestamp);
      }
      cargarPedidosCocina();
    });

    function cargarPedidosCocina() {
      const grid = document.getElementById('grid-comandas');
      const msjVacio = document.getElementById('sin-pedidos');

      let pedidosFiltrados = pedidos.filter(p => p.estado !== 'entregado');
      
      if (filtroActual !== 'todos') {
        pedidosFiltrados = pedidosFiltrados.filter(p => p.estado === filtroActual);
      }

      document.getElementById('cant-todos').innerText = pedidos.filter(p => p.estado !== 'entregado').length;
      document.getElementById('cant-pendiente').innerText = pedidos.filter(p => p.estado === 'pendiente').length;
      document.getElementById('cant-preparacion').innerText = pedidos.filter(p => p.estado === 'preparacion').length;

      if (pedidosFiltrados.length === 0) {
        grid.innerHTML = '';
        msjVacio.classList.remove('hidden');
        return;
      }

      msjVacio.classList.add('hidden');
      grid.innerHTML = pedidosFiltrados.map(p => crearTarjetaComanda(p)).join('');
    }
    function crearTarjetaComanda(p) {
      const esPendiente = p.estado === 'pendiente';
      const esPreparacion = p.estado === 'preparacion';

      let borderStyle = esPendiente ? 'border-amber-500/50 bg-amber-950/10' : 'border-emerald-500/50 bg-emerald-950/10';
      let badgeEstado = esPendiente 
        ? `<span class="bg-amber-500/20 text-amber-300 border border-amber-500/40 text-xs px-2.5 py-1 rounded-full font-bold">⚠️ Pendiente Confirmar</span>`
        : `<span class="bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 text-xs px-2.5 py-1 rounded-full font-bold animate-pulse">🔥 En Preparación</span>`;

      let badgeTipo = p.tipo === 'delivery'
        ? `<span class="bg-blue-600/30 text-blue-300 border border-blue-500/40 text-xs px-2 py-0.5 rounded font-bold">🛵 Delivery</span>`
        : `<span class="bg-purple-600/30 text-purple-300 border border-purple-500/40 text-xs px-2 py-0.5 rounded font-bold">🛍️ Retiro</span>`;

      return `
        <div class="bg-gray-800 rounded-2xl border ${borderStyle} p-5 shadow-xl flex flex-col justify-between relative overflow-hidden">
          <div>
            <div class="flex justify-between items-start border-b border-gray-700 pb-3 mb-3">
              <div>
                <span class="text-2xl font-black text-white tracking-wider">${p.id}</span>
                <div class="flex items-center gap-2 mt-1">
                  ${badgeTipo}
                  <span class="text-xs text-gray-400 font-mono">${p.hora}</span>
                </div>
              </div>
              <div>${badgeEstado}</div>
            </div>

            <div class="text-xs text-gray-300 mb-4 bg-gray-900/60 p-2.5 rounded-lg border border-gray-700/50 space-y-1">
              <p><strong>Cliente:</strong> ${p.cliente}</p>
              <p><strong>Teléfono:</strong> ${p.telefono}</p>
              ${p.direccion ? `<p><strong>Dirección:</strong> <span class="text-amber-200">${p.direccion}</span></p>` : ''}
            </div>

            <div class="space-y-2 mb-6">
              <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Comanda:</p>
              <ul class="divide-y divide-gray-700/50 text-sm">
                ${p.items.map(item => `
                  <li class="py-1.5 flex justify-between items-center font-semibold">
                    <span class="text-emerald-300 font-bold">${item.cant}x</span>
                    <span class="text-white flex-grow ml-2">${item.nombre}</span>
                  </li>
                `).join('')}
              </ul>
            </div>
          </div>

          <div class="pt-3 border-t border-gray-700 flex flex-col gap-2">
            ${esPendiente ? `
         <button onclick="confirmarEInformaCliente('${p.id}', '${p.telefono}', '${p.cliente}')" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl transition flex items-center justify-center gap-2 text-sm shadow-lg">
  <span>👨‍🍳 Confirmar e Iniciar Cocina</span>
</button>
            ` : ''}

            ${esPreparacion ? `
              <button onclick="cambiarEstadoPedido('${p.id}', 'entregado')" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-xl transition flex items-center justify-center gap-2 text-sm shadow-lg">
                <span>✅ Marcar como Finalizado / Entregado</span>
              </button>
            ` : ''}
          </div>
        </div>
      `;
    }

    // Actualiza el estado en Firebase
    function cambiarEstadoPedido(idPedido, nuevoEstado) {
      db.ref('pedidos/' + idPedido.replace('#', '')).update({
        estado: nuevoEstado
      });
    }
        // Función para enviar los datos bancarios directamente al cliente desde la cocina
function enviarDatosPagoWA(telefonoCliente, idPedido, total) {
  let numLimpio = telefonoCliente.replace(/\D/g, '');
  if (numLimpio.length === 9 && numLimpio.startsWith('9')) {
    numLimpio = '56' + numLimpio;
  }

  const mensaje = `¡Hola! 👋 Para completar tu pedido ${idPedido}, puedes transferir el total de $${total} a la siguiente cuenta:\n\n📌 *DATOS DE TRANSFERENCIA:* \nBanco: [Tu Banco]\nTipo: CuentaRUT / Corriente\nN°: [Número]\nRUT: [RUT]\nNombre: [Nombre Titular]\nCorreo: [Correo]\n\nPor favor reenvíanos el comprobante por este chat. ¡Muchas gracias!`;

  window.open(`https://wa.me/${numLimpio}?text=${encodeURIComponent(mensaje)}`, '_blank');
}
    
function confirmarEInformaCliente(idPedido, telefonoCliente, nombreCliente) {
  // 1. Actualizar el estado en Firebase
  db.ref('pedidos/' + idPedido.replace('#', '')).update({
    estado: 'preparacion'
  });

  // 2. Formatear y limpiar el número de teléfono
  let numLimpio = telefonoCliente.replace(/\D/g, '');
  
  // Si no tiene código de país (ej. Chile 56), se lo antepone si empieza con 9
  if (numLimpio.length === 9 && numLimpio.startsWith('9')) {
    numLimpio = '56' + numLimpio;
  }

  // 3. Crear el mensaje personalizado
  const mensaje = `¡Hola ${nombreCliente}! 👋\n\nTu pedido ${idPedido} ha sido *confirmado* por el equipo de cocina y ya se encuentra en preparación. 🔥🍔\n\nTe avisaremos apenas esté listo. ¡Muchas gracias!`;

  // 4. Abrir WhatsApp en una nueva pestaña
  const urlWA = `https://wa.me/${numLimpio}?text=${encodeURIComponent(mensaje)}`;
  window.open(urlWA, '_blank');
}
    function filtrarPedidos(filtro) {
      filtroActual = filtro;
      const btnTodos = document.getElementById('btn-filtro-todos');
      const btnPend = document.getElementById('btn-filtro-pendiente');
      const btnPrep = document.getElementById('btn-filtro-preparacion');

      const activoClass = "px-3 py-1.5 rounded-lg font-bold bg-emerald-600 text-white";
      const inactivoClass = "px-3 py-1.5 rounded-lg font-bold text-gray-300 hover:bg-gray-700";

      btnTodos.className = filtro === 'todos' ? activoClass : inactivoClass;
      btnPend.className = filtro === 'pendiente' ? activoClass : inactivoClass;
      btnPrep.className = filtro === 'preparacion' ? activoClass : inactivoClass;

      cargarPedidosCocina();
    }
  </script>
</body>
</html>
