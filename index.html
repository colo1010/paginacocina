<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Burger Kitchen | Panel de Cocina 👨‍🍳</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- SDKs de Firebase Realtime Database -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-4 sm:p-6">

  <!-- Encabezado de Cocina -->
  <header class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center pb-6 border-b border-gray-800 gap-4">
    <div>
      <h1 class="text-3xl font-black text-emerald-400 tracking-wider flex items-center gap-2">
        <span>🍔</span> BURGER KITCHEN - COCINA
      </h1>
      <p class="text-xs text-gray-400 mt-1">Monitor de comandas enfocado en preparación</p>
    </div>
    
    <div class="flex items-center gap-4">
      <div id="estado-conexion" class="flex items-center gap-2 bg-gray-800 px-3 py-1.5 rounded-full text-xs font-bold text-emerald-400 border border-emerald-900">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <span>Conectado a Firebase</span>
      </div>
      <button onclick="activarSonido()" id="btn-sonido" class="bg-gray-800 hover:bg-gray-700 text-gray-200 text-xs px-3 py-1.5 rounded-lg border border-gray-700 font-bold transition">
        🔔 Activar Audio
      </button>
    </div>
  </header>

  <!-- Contenedor Principal de Comandas -->
  <main class="max-w-7xl mx-auto mt-6">
    <div id="sin-pedidos" class="text-center py-20 text-gray-500">
      <span class="text-6xl block mb-3">👨‍🍳</span>
      <h2 class="text-xl font-bold text-gray-400">No hay comandas pendientes</h2>
      <p class="text-xs text-gray-600 mt-1">Los nuevos pedidos realizados por los clientes aparecerán aquí automáticamente.</p>
    </div>

    <!-- Grid de Comandas -->
    <div id="contenedor-comandas" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>

  <script>
    // Configuración e Inicialización de Firebase Realtime Database
    const firebaseConfig = {
      apiKey: "AIzaSyCI3CWPBGqBsq30CC3AouVu3p4uhkNOkrw",
      authDomain: "comandas-114cc.firebaseapp.com",
      databaseURL: "https://comandas-114cc-default-rtdb.firebaseio.com",
      projectId: "comandas-114cc",
      storageBucket: "comandas-114cc.firebasestorage.app",
      messagingSenderId: "852269899168",
      appId: "1:852269899168:web:e05fef229b9a8db29158c5",
      measurementId: "G-JGJWWQLVZ1"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let sonidoPermitido = false;
    let audioNotificacion = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
    let comandasCache = {}; 

    function activarSonido() {
      sonidoPermitido = true;
      audioNotificacion.play().then(() => {
        audioNotificacion.pause();
        audioNotificacion.currentTime = 0;
      }).catch(() => {});
      
      const btn = document.getElementById('btn-sonido');
      btn.innerText = "🔔 Audio Activado";
      btn.className = "bg-emerald-900/50 text-emerald-300 text-xs px-3 py-1.5 rounded-lg border border-emerald-700 font-bold";
    }

    let conteoPrevio = -1;

    db.ref('comandas').on('value', (snapshot) => {
      const data = snapshot.val();
      const contenedor = document.getElementById('contenedor-comandas');
      const mensajeVacio = document.getElementById('sin-pedidos');

      contenedor.innerHTML = '';
      comandasCache = {};

      if (!data) {
        mensajeVacio.classList.remove('hidden');
        conteoPrevio = 0;
        return;
      }

      const keys = Object.keys(data);
      let pedidosActivos = 0;

      if (conteoPrevio !== -1 && keys.length > conteoPrevio && sonidoPermitido) {
        audioNotificacion.play().catch(() => {});
      }
      conteoPrevio = keys.length;

      keys.reverse().forEach(key => {
        const pedido = data[key];
        
        if (pedido.estado !== 'entregado') {
          pedidosActivos++;
          comandasCache[key] = pedido;
          contenedor.appendChild(crearTarjetaComanda(key, pedido));
        }
      });

      if (pedidosActivos === 0) {
        mensajeVacio.classList.remove('hidden');
      } else {
        mensajeVacio.classList.add('hidden');
      }

      actualizarTemporizadores();
    });

    function crearTarjetaComanda(key, p) {
      const card = document.createElement('div');
      card.id = `card-${key}`;
      
      let borderStyle = "border-emerald-500/40 bg-gray-800";
      let badgeEstado = `<span class="bg-amber-500/20 text-amber-300 border border-amber-500/40 px-2.5 py-0.5 rounded-full text-xs font-bold uppercase">⏳ Pendiente</span>`;
      
      if (p.estado === 'en_preparacion') {
        borderStyle = "border-blue-500/50 bg-gray-800/90";
        badgeEstado = `<span class="bg-blue-500/20 text-blue-300 border border-blue-500/40 px-2.5 py-0.5 rounded-full text-xs font-bold uppercase animate-pulse">🔥 En Cocina</span>`;
      } else if (p.estado === 'listo') {
        borderStyle = "border-emerald-500 bg-gray-800";
        badgeEstado = `<span class="bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 px-2.5 py-0.5 rounded-full text-xs font-bold uppercase">✅ Listo</span>`;
      }

      // Detalle de productos con tamaño de letra MÁS GRANDE (text-lg / text-xl)
      let itemsHtml = p.items ? p.items.map(item => `
        <li class="flex justify-between items-center py-1.5 border-b border-gray-700/60">
          <span class="font-black text-amber-400 text-xl sm:text-2xl">${item.cantidad}x</span>
          <span class="text-white font-black text-lg sm:text-xl flex-grow ml-3">${item.nombre}</span>
        </li>
      `).join('') : '<li class="text-sm text-gray-500">Sin detalles de productos</li>';

      card.className = `rounded-xl p-5 border-2 shadow-xl flex flex-col justify-between transition ${borderStyle}`;
      card.innerHTML = `
        <div>
          <!-- Cabecera de la Comanda + Cronómetro -->
          <div class="flex justify-between items-start mb-2 border-b border-gray-700 pb-2">
            <div>
              <span class="text-2xl font-black text-white tracking-wide">${p.numPedido || '#BK-000'}</span>
              <span class="text-[10px] text-gray-400 block mt-0.5">${p.fecha || ''}</span>
            </div>
            <div class="flex flex-col items-end gap-1">
              ${badgeEstado}
              <!-- Badge de Tiempo Transcurrido -->
              <span id="timer-${key}" class="px-2.5 py-0.5 rounded-md text-xs font-mono font-black border transition-all">
                ⏱️ 00:00
              </span>
            </div>
          </div>

          <!-- DETALLE DEL PEDIDO PRINCIPAL (MÁS GRANDE Y DESTACADO) -->
          <div class="my-4 bg-gray-900/80 p-3 rounded-xl border border-gray-700">
            <h4 class="text-[10px] font-extrabold uppercase tracking-widest text-emerald-400 mb-2">🔥 PARA PREPARAR:</h4>
            <ul class="space-y-1">
              ${itemsHtml}
            </ul>
          </div>

          <!-- DATOS SECUNDARIOS DEL CLIENTE (MÁS PEQUEÑOS Y DISCRETOS) -->
          <div class="text-[11px] text-gray-400 mb-3 bg-gray-950/40 p-2 rounded-lg border border-gray-800/80 flex justify-between items-center gap-2">
            <div>
              <p><strong class="text-gray-300">Cliente:</strong> ${p.cliente}</p>
              ${p.tipoEntrega === 'delivery' ? `<p class="truncate max-w-[180px]"><strong class="text-gray-300">Dir:</strong> ${p.direccion}</p>` : ''}
            </div>
            <span class="uppercase text-[10px] font-bold px-2 py-0.5 rounded bg-gray-800 text-gray-300 border border-gray-700 whitespace-nowrap">
              ${p.tipoEntrega === 'delivery' ? '🛵 Delivery' : '🛍️ Retiro'}
            </span>
          </div>
        </div>

        <!-- Total y Acciones de Estado -->
        <div class="pt-2 border-t border-gray-700">
          <div class="flex justify-between items-center mb-2 text-xs">
            <span class="text-gray-500 font-semibold">Total:</span>
            <span class="font-bold text-gray-300">$${(p.total || 0).toLocaleString('es-CL')} CLP</span>
          </div>

          <div class="grid grid-cols-2 gap-2">
            ${p.estado === 'pendiente' ? `
              <button onclick="cambiarEstado('${key}', 'en_preparacion')" class="col-span-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-extrabold py-2.5 rounded-lg transition shadow">
                🔥 Iniciar Preparación
              </button>
            ` : ''}

            ${p.estado === 'en_preparacion' ? `
              <button onclick="cambiarEstado('${key}', 'listo')" class="col-span-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-extrabold py-2.5 rounded-lg transition shadow">
                ✅ Marcar como Listo
              </button>
            ` : ''}

            ${p.estado === 'listo' ? `
              <button onclick="cambiarEstado('${key}', 'entregado')" class="col-span-2 bg-gray-700 hover:bg-gray-600 text-gray-200 text-xs font-extrabold py-2.5 rounded-lg transition">
                📦 Despachar / Archivar
              </button>
            ` : ''}
          </div>
        </div>
      `;

      return card;
    }

    function actualizarTemporizadores() {
      const ahora = Date.now();

      Object.keys(comandasCache).forEach(key => {
        const p = comandasCache[key];
        const timerElem = document.getElementById(`timer-${key}`);
        if (!timerElem) return;

        const inicio = p.timestamp || ahora;
        const diferenciaMs = ahora - inicio;
        
        const totalSegundos = Math.floor(diferenciaMs / 1000);
        const minutos = Math.floor(totalSegundos / 60);
        const segundos = totalSegundos % 60;

        const minFmt = String(minutos).padStart(2, '0');
        const segFmt = String(segundos).padStart(2, '0');

        timerElem.innerText = `⏱️ ${minFmt}:${segFmt}`;

        if (minutos < 10) {
          timerElem.className = "px-2.5 py-0.5 rounded-md text-xs font-mono font-black border bg-emerald-500/20 text-emerald-300 border-emerald-500/40";
        } else if (minutos < 20) {
          timerElem.className = "px-2.5 py-0.5 rounded-md text-xs font-mono font-black border bg-amber-500/20 text-amber-300 border-amber-500/40";
        } else {
          timerElem.className = "px-2.5 py-0.5 rounded-md text-xs font-mono font-black border bg-red-500/30 text-red-300 border-red-500/60 animate-pulse";
        }
      });
    }

    setInterval(actualizarTemporizadores, 1000);

    function cambiarEstado(key, nuevoEstado) {
      db.ref(`comandas/${key}`).update({
        estado: nuevoEstado
      }).catch(err => {
        alert("Error al actualizar estado en Firebase");
      });
    }
  </script>
</body>
</html>
